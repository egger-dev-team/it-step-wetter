apiVersion: 1

datasources:
  - name: Weatherstation Postgres
    uid: weatherstation-postgres
    type: postgres
    access: proxy
    isDefault: true
    url: db:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
