[project]
name = "weather-server"
version = "0.1.0"
description = "Local weather station server for ESP8266"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "psycopg[binary]>=3.2.0",
]

[tool.uv]
package = true

[project.scripts]
weather-server = "weather_server.main:run"
