services:
  db:
    image: postgres:16-alpine
    container_name: weatherstation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weatherstation}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weatherstation}"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weatherstation-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEATHER_SERVER_HOST: 0.0.0.0
      WEATHER_SERVER_PORT: 8000
      WEATHER_API_KEY: ${WEATHER_API_KEY:-46885206}
      WEATHER_RETENTION_DAYS: ${WEATHER_RETENTION_DAYS:-7}
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD:-weather}@db:5432/${POSTGRES_DB:-weatherstation}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: weatherstation-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      POSTGRES_DB: ${POSTGRES_DB:-weatherstation}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  grafana_data:
